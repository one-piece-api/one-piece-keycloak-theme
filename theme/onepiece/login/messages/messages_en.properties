# English copy for the "onepiece" theme pages (login, password reset/update,
# profile update, email verification, generic error/info). Keys not listed
# here fall back to the base Keycloak theme's own English (already the
# default locale, so nothing further to inherit): covers only the flows
# actually in use on this realm (no registration, social providers,
# WebAuthn/OTP, SAML, brokering - absent from realm-onepiece.json).
# Mirrors messages_it.properties key-for-key, same pirate-themed tone.

