# Copy italiana per le pagine del tema "onepiece" (login, reset/aggiornamento
# password, aggiornamento profilo, verifica email, errore/info generici).
# Chiavi non elencate qui restano in inglese (ereditate dal tema base):
# copre solo i flussi realmente in uso in questo realm (niente registrazione,
# provider social, WebAuthn/OTP, SAML, brokering - assenti da realm-onepiece.json).
# Per essere effettivamente servito, il realm deve avere l'internazionalizzazione
# abilitata con "it" tra le locale supportate (vedi realm-onepiece.json).

