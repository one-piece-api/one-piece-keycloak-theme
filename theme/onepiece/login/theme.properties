# Tema "onepiece": eredita struttura/logica dal tema ufficiale "keycloak"
# (parent) e sostituisce solo copy (messages/) e aspetto (css/img) - nessun
# template .ftl viene copiato o modificato. I template di Keycloak generano
# markup con classi lette da questo file (${properties.kcXxxClass!}) o con
# id/classi fisse (es. .card-pf, .alert-error, #kc-page-title): onepiece.css
# si aggancia a quel contratto stabile invece di duplicare i .ftl, cosa che
# terrebbe il tema allineato automaticamente ai futuri aggiornamenti di
# Keycloak sullo stesso major (26.x).
parent=keycloak
import=common/keycloak

# Sostituisce interamente il CSS del parent (niente PatternFly/FontAwesome:
# il nuovo stile non li usa e il tema resta cosi' piu' leggero).
styles=css/onepiece.css
stylesCommon=

# Le icone dei banner di feedback (successo/attesa/errore/info) diventano il
# Den Den Mushi al posto delle glyph FontAwesome, disegnate in CSS.
kcFeedbackSuccessIcon=onepiece-feedback-icon onepiece-feedback-icon-ok
kcFeedbackWarningIcon=onepiece-feedback-icon onepiece-feedback-icon-warn
kcFeedbackErrorIcon=onepiece-feedback-icon onepiece-feedback-icon-err
kcFeedbackInfoIcon=onepiece-feedback-icon onepiece-feedback-icon-info
