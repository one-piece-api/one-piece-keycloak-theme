# English copy for the "onepiece" email theme. Covers only the keys used by
# the single email flow actually in use in this realm: inviting a new user,
# which always sets exactly UPDATE_PASSWORD, UPDATE_PROFILE and VERIFY_EMAIL
# as requiredActions (see
# KeycloakUserDirectoryAdapter.INVITATION_REQUIRED_ACTIONS in
# one-piece-user-service). Keys not listed here fall back to the "base" theme
# (see also the comment in ../../login/messages/messages_en.properties).

# Required actions (listed inside executeActionsBodyHtml/Body)
requiredAction.UPDATE_PASSWORD=Set a password
requiredAction.UPDATE_PROFILE=Complete your profile
requiredAction.VERIFY_EMAIL=Verify your email address

# Enlistment email (sent when an admin invites/re-invites a user)
executeActionsSubject=Ready to set sail? Finish signing up on One Piece API
executeActionsBodyHtml=<h2>Ahoy, future crewmate!</h2><p>The captain just opened your cabin aboard <b>One Piece API</b>: before you can set sail you''ll need to — {3}.</p><p><a href="{0}">Come aboard</a></p><p>This link sinks in {4}, so use it before it goes down with the ship.</p><p>If you weren''t expecting this invitation, just ignore this message: nothing will change.</p>
executeActionsBody=Ahoy, future crewmate! The captain just opened your cabin aboard One Piece API: {3}.\n\nFollow this link to come aboard:\n{0}\n\nThis link sinks in {4}.\n\nIf you weren''t expecting this invitation, just ignore this message: nothing will change.

# Footer (all emails)
emailFooterTagline=Delivered via Den Den Mushi from One Piece API
