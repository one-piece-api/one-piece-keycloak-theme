# Copy italiana per il tema email "onepiece". Copre solo le chiavi usate
# dall'unico flusso email realmente in uso in questo realm: l'invito di un
# nuovo utente, che imposta sempre esattamente UPDATE_PASSWORD, UPDATE_PROFILE
# e VERIFY_EMAIL come requiredActions (vedi
# KeycloakUserDirectoryAdapter.INVITATION_REQUIRED_ACTIONS in
# one-piece-user-service). Chiavi non elencate qui restano quelle del tema
# "base" (vedi anche il commento in ../../login/messages/messages_it.properties).

# Azioni richieste (compaiono nella lista dentro executeActionsBodyHtml/Body)
requiredAction.UPDATE_PASSWORD=Impostare una password
requiredAction.UPDATE_PROFILE=Completare il profilo
requiredAction.VERIFY_EMAIL=Verificare l''indirizzo email

# Email di arruolamento (eseguita quando un admin invita/re-invita un utente)
executeActionsSubject=Pronto a salpare? Completa il tuo arruolamento su One Piece API
executeActionsBodyHtml=<h2>Ahoy, futuro membro della ciurma!</h2><p>Il capitano ha appena aperto la tua cabina a bordo di <b>One Piece API</b>: prima di issare le vele dovrai completare questi passaggi — {3}.</p><p><a href="{0}">Sali a bordo</a></p><p>Il collegamento affonda fra {4}: usalo prima che faccia naufragio.</p><p>Se non ti aspettavi questo arruolamento, ignora pure il messaggio: la ciurma resterà com''è.</p>
executeActionsBody=Ahoy, futuro membro della ciurma! Il capitano ha appena aperto la tua cabina a bordo di One Piece API: {3}.\n\nSegui questo collegamento per salire a bordo:\n{0}\n\nIl collegamento affonda fra {4}.\n\nSe non ti aspettavi questo arruolamento, ignora pure il messaggio: la ciurma resterà com''è.

# Piede pagina (tutte le email)
emailFooterTagline=Spedito via Lumacofono da One Piece API
