name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          # Runner nativo arm64 (gratuito sui repo pubblici) invece di QEMU:
          # il nodo Ampere A1 dell'ambiente remoto (ADR-0005 in
          # onepiece-infrastructure) e' arm64, serve un'immagine nativa per
          # quell'architettura.
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push solo per digest, senza tag finale: il tag multi-arch viene
      # creato dal job "merge-manifest" combinando i digest di ogni
      # piattaforma - stesso pattern di user-service/user-frontend (ADR-0004
      # in onepiece-infrastructure).
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          outputs: type=image,name=ghcr.io/one-piece-api/keycloak-theme,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    name: Merge multi-arch manifest & push tags
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nessun package.json/versione applicativa in questo repo (solo file di
      # tema): solo tag "latest", niente tag per-commit. Un tag univoco per
      # ogni push (es. lo SHA) resterebbe taggato per sempre e "cleanup-untagged"
      # sotto - che cancella solo i digest senza alcun tag - non lo
      # rimuoverebbe mai, accumulando un'immagine per commit. Con un solo tag
      # mobile, il digest precedente diventa untagged ad ogni push e viene
      # eliminato da quel job, come per user-service/user-frontend (dove la
      # stessa cosa succede quando la versione non cambia da un push all'altro).
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/one-piece-api/keycloak-theme:latest \
            $(printf 'ghcr.io/one-piece-api/keycloak-theme@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/one-piece-api/keycloak-theme:latest

  trigger-remote-deploy:
    name: Trigger remote environment deploy
    runs-on: ubuntu-latest
    needs: merge-manifest
    if: github.event_name == 'push'
    steps:
      # onepiece-infrastructure possiede l'unico workflow che sa come
      # aggiornare l'ambiente remoto (ADR-0005) - niente logica di deploy
      # duplicata qui, solo la notifica che una nuova immagine e' pronta.
      - name: Notifica onepiece-infrastructure
        run: |
          curl -sf -L --post301 -X POST \
            -H "Authorization: Bearer ${{ secrets.INFRA_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/one-piece-api/onepiece-infrastructure/dispatches \
            -d '{"event_type":"deploy-remote"}'

  cleanup-untagged:
    name: Delete untagged package versions
    runs-on: ubuntu-latest
    needs: merge-manifest
    if: github.event_name == 'push'
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # I sotto-manifest per piattaforma (amd64/arm64) pushati per digest da
      # "Build and push by digest" non hanno mai un tag proprio - solo
      # l'indice multi-arch creato da "merge-manifest" li referenzia. GHCR
      # li riporta quindi come "untagged" esattamente come una versione
      # davvero orfana: cancellarli tutti rompe il tag che li referenzia
      # ("manifest unknown" al pull). Si esclude dalla cancellazione ogni
      # digest ancora referenziato come sotto-manifest da un tag corrente.
      - name: Delete dangling (untagged) versions from GHCR
        run: |
          set -euo pipefail
          referenced="$(
            gh api --paginate "orgs/one-piece-api/packages/container/keycloak-theme/versions" \
              --jq '.[] | select(.metadata.container.tags != []) | .metadata.container.tags[0]' \
            | while read -r tag; do
                docker buildx imagetools inspect "ghcr.io/one-piece-api/keycloak-theme:$tag" --raw
              done \
            | jq -r '.manifests[]?.digest // empty'
          )"
          gh api --paginate "orgs/one-piece-api/packages/container/keycloak-theme/versions" \
            --jq '.[] | select(.metadata.container.tags == []) | [.id, .name] | @tsv' \
          | while IFS=$'\t' read -r id digest; do
              grep -qxF "$digest" <<< "$referenced" || gh api --method DELETE "orgs/one-piece-api/packages/container/keycloak-theme/versions/$id"
            done
